name: Manter Supabase ativo

# Projetos gratuitos do Supabase são pausados automaticamente depois de
# ~7 dias sem nenhuma requisição. Este workflow faz uma consulta bem leve
# de tempos em tempos só para contar como atividade e evitar a pausa.
# Usa a mesma "publishable key" pública que já está em
# js/supabase-config.js (ela só tem acesso de leitura, controlado pelas
# regras de segurança do banco em supabase/schema.sql) — não é segredo,
# por isso fica hardcoded aqui em vez de em uma secret.

on:
  schedule:
    - cron: "0 12 */3 * *" # a cada 3 dias, às 12h UTC
  workflow_dispatch: {} # também dá para rodar manualmente na aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://uggdjpzryotxiogysymi.supabase.co
      SUPABASE_ANON_KEY: sb_publishable__8ZmBIGiG8jE2kNxfIxIhA_VkSbjS3F
    steps:
      - name: Fazer uma requisição leve ao Supabase
        run: |
          curl -sS --fail \
            "$SUPABASE_URL/rest/v1/paginas?select=country_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
