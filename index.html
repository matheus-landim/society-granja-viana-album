<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Álbum de Figurinhas — Society Granja Viana</title>
<meta name="description" content="Álbum de figurinhas digital do campeonato interno — Society Granja Viana.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-badge">⚽</span>
    <div>
      <strong>Society Granja Viana</strong>
      <span>Álbum do Campeonato Interno</span>
    </div>
  </div>

  <nav class="country-nav" id="country-nav" aria-label="Selecionar país"></nav>

  <div class="auth-area">
    <button id="btn-login" type="button" class="btn btn-outline">Entrar</button>
    <button id="btn-logout" type="button" class="btn btn-outline" hidden>Sair</button>
  </div>
</header>

<main id="pagina" class="pagina">
  <button type="button" id="prev-country" class="seta seta-prev" aria-label="País anterior">‹</button>
  <button type="button" id="next-country" class="seta seta-next" aria-label="Próximo país">›</button>

  <section class="pagina-header">
    <div class="header-emblemas">
      <div class="emblema-pais">
        <div class="emblema-pais-circulo" id="pagina-bandeira">🏳️</div>
        <p class="emblema-legenda">Seleção</p>
      </div>

      <div class="capa-wrap pixel-frame">
        <img id="capa-img" alt="Foto da equipe" class="capa-img">
        <label class="somente-edicao upload-btn">
          Trocar foto
          <input type="file" id="capa-input" accept="image/*" hidden>
        </label>
      </div>

      <div class="emblema-campeonato">
        <div class="emblema-campeonato-circulo">
          <span class="emblema-campeonato-icone">⚽</span>
          <span class="emblema-campeonato-texto">CAMPEONATO<br>INTERNO</span>
        </div>
      </div>
    </div>

    <h1 class="pagina-titulo-faixa"><span id="pagina-titulo">—</span></h1>

    <div class="pagina-acoes">
      <button type="button" id="btn-exportar-selecao" class="btn btn-ghost">⬇ Salvar seleção</button>
      <button type="button" id="btn-exportar-pagina" class="btn btn-ghost">⬇ Salvar página inteira</button>
    </div>
  </section>

  <p class="grid-dica">Toque numa figurinha para baixar a foto do jogador.</p>
  <section class="grid-figurinhas" id="grid-figurinhas" aria-label="Figurinhas dos jogadores"></section>
</main>

<dialog id="login-modal" class="login-modal">
  <form id="login-form" class="login-form">
    <h2>Entrar para editar o álbum</h2>
    <label>
      Usuário
      <input type="text" id="login-usuario" name="usuario" autocomplete="username" required>
    </label>
    <label>
      Senha
      <input type="password" id="login-senha" name="senha" autocomplete="current-password" required>
    </label>
    <p id="login-erro" class="login-erro" role="alert" hidden></p>
    <div class="login-form-acoes">
      <button type="button" id="btn-fechar-login" class="btn btn-outline">Cancelar</button>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </div>
  </form>
</dialog>

<footer class="site-footer">
  <p>Society Granja Viana · Álbum de figurinhas do campeonato interno</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="js/supabase-config.js"></script>
<script src="js/countries.js"></script>
<script src="js/album.js"></script>
<script src="js/export.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
